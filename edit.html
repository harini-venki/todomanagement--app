
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container edit-container">
    <h1>Edit Todo</h1>

    <form id="edit-form">
      <label for="edit-input">Task name</label>
      <input id="edit-input" type="text" required>

      <button type="submit">Save Changes</button>
      <a class="back-link" href="index.html">Cancel / Back</a>
    </form>

    <p id="edit-status"></p>
  </main>

  <script src="edit.js"></script>
</body>
</html>
